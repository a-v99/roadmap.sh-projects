<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="grid-container">
        <img class="grid-item img-01" src="../assets/photo-01.avif" alt="A foggy beach with a large rock formation in the foreground">
        <img class="grid-item img-02" src="../assets/photo-02.avif" alt="A living room with a white couch and a round window">
        <img class="grid-item img-03" src="../assets/photo-03.avif" alt="A table topped with plates and bowls of food">
        <img class="grid-item img-04" src="../assets/photo-04.avif" alt="A building with a red door and a tree in front of it">
        <img class="grid-item img-05" src="../assets/photo-05.avif" alt="A row of white apartment buildings next to a street">
        <img class="grid-item img-06" src="../assets/photo-06.avif" alt="A view of a beach from the top of a hill">
    </div>

</body>

</html>
