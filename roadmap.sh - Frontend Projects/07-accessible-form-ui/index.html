<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form UI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="form-container">
        <form action="#" method="post">
            <div class="name">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" placeholder="What should we call you?"
                    aria-required="true">
            </div>

            <div class="email">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" aria-required="true"
                    aria-invalid="false">
                <span id="email-error" class="error-message" role="alert">Please enter a valid email address.</span>
            </div>

            <div class="password-container">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="xxxxxxxx" aria-required="true">
                <button type="button" id="toggle-password" class="show-pw-btn" aria-label="Password is hidden"
                    aria-pressed="false">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>

            <div class="password-container">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="xxxxxxxx"
                    aria-required="true">
                <button type="button" id="toggle-confirm-password" class="show-pw-btn" aria-label="Password is hidden"
                    aria-pressed="false">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>

            <div class="submit">
                <button type="submit" class="update-profile-btn" aria-label="submit">Update Profile</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar">65%</div>
            </div>

            <div class="form-footer">
                <ul class="checklist">
                    <li class="completed">Create Account</li>
                    <li class="completed">Update Roadmap Progress</li>
                    <li class="completed">Setup Public Profile</li>
                    <li>Complete your first project</li>
                    <li>Invite your friends</li>
                </ul>
            </div>
        </form>
    </div>
</body>
</html>
