<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>

    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="dropdown">
        <div class="select">
            <span class="selected">Select an option...</span>
            <div class="caret"></div>
        </div>
        <ul class="menu">
            <li>First Option</li>
            <li>Second Option</li>
            <li>Third Option</li>
            <li>Fourth Option</li>
            <li>Fifth Option</li>
        </ul>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
